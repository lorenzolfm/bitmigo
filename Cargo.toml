[workspace]
resolver = "3"
members = ["crates/consensus", "crates/bitmigo", "crates/differential"]
# The differential crate is on demand only (`cargo test -p bitmigo-differential`): it builds
# Bitcoin Core's C++ script verifier as a test oracle, which the node never links.
default-members = ["crates/consensus", "crates/bitmigo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lorenzolfm/bitmigo"

[workspace.dependencies]
bitmigo-consensus = { path = "crates/consensus" }

# The only third-party crates the node links, pinned exactly. See
# docs/decisions/0001-primitive-crates.md for why these three and why nothing else.
# `bitcoin` 0.32 itself depends on `hashes ^0.14` and `secp256k1 ^0.29`, so the pins below
# are the versions it resolves to: one copy of each crate in the tree, and the re-exports
# `bitcoin::hashes` / `bitcoin::secp256k1` name the same types as the direct dependencies.
#
# Default features are off so that every enabled feature is a visible choice. In particular
# `bitcoin/bitcoinconsensus` must never be enabled: the whole point of this repository is
# to validate scripts with its own interpreter.
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
bitcoin_hashes = { version = "=0.14.101", default-features = false, features = ["std"] }
secp256k1 = { version = "=0.29.1", default-features = false, features = ["std"] }

# Test-only oracle for `crates/differential` and nothing else: Bitcoin Core 26.0's script
# verifier, compiled from its C++ sources. The registry version is `0.106.0+26.0`; cargo
# ignores build metadata in requirements, so the pin is spelled without it. See
# docs/decisions/0003-differential-oracle.md.
bitcoinconsensus = { version = "=0.106.0", default-features = false, features = ["std"] }

# The fourth crate, and the node binary's alone: `crates/consensus` never links it and its
# purity tripwire is untouched. `std` gives the node every other syscall it needs — socket
# timeouts, `shutdown`, `pread`, `fsync`, Unix sockets, explicit stack sizes — but no signal
# handling, and a node that cannot answer `SIGINT` cleanly turns every Ctrl-C into a
# crash-recovery restart. rust-lang first-party, zero transitive dependencies. See
# docs/decisions/0004-libc.md.
libc = { version = "=0.2.189", default-features = false, features = ["std"] }

[workspace.lints.rust]
# `deny`, not `forbid`, because `bitmigo::runtime::signal` needs `sigaction` and a `write`
# from a signal handler, and lifts this with an `#[allow]` that names its reason. Every
# other crate root re-states it as `#![forbid(unsafe_code)]`, which cannot be lifted at all.
unsafe_code = "deny"
missing_docs = "warn"

# TigerStyle, mechanised where clippy can. The function-length threshold (70) lives in
# `clippy.toml`. Lints that fight the assertion discipline (`unwrap_used`,
# `missing_panics_doc`) stay off on purpose: a panic on a broken invariant is the point.
[workspace.lints.clippy]
all = { level = "warn", priority = 0 }
pedantic = { level = "warn", priority = 1 }

# Hard rule H1: a function fits on a screen.
too_many_lines = { level = "deny", priority = 2 }
# `as` is a silent cast; `try_from` turns a truncation into an assertion.
as_conversions = { level = "warn", priority = 2 }
cast_possible_truncation = { level = "warn", priority = 2 }
# Prefer an explicit bounds assertion to an implicit panic inside an index.
indexing_slicing = { level = "warn", priority = 2 }
unwrap_in_result = { level = "warn", priority = 2 }
# A swallowed error is an unhandled error.
let_underscore_must_use = { level = "warn", priority = 2 }
allow_attributes_without_reason = { level = "warn", priority = 2 }
todo = { level = "warn", priority = 2 }
unimplemented = { level = "warn", priority = 2 }

# Pedantic lints that work against the style.
missing_panics_doc = { level = "allow", priority = 3 }
missing_errors_doc = { level = "allow", priority = 3 }
module_name_repetitions = { level = "allow", priority = 3 }

# Panics are prevented, not contained. A panic in framing code that is caught and logged is a
# bug that will never be found; an abort is loud, the storage engine's crash consistency makes
# it lose nothing but time, and the process supervisor restarts the node.
# `overflow-checks` puts arithmetic on attacker-supplied lengths in scope of that rule too,
# which is the reason it is on in release and not just in debug.
[profile.release]
panic = "abort"
overflow-checks = true
